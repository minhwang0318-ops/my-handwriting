# main에 올리면 테스트 → 정적 파일로 빌드 → GitHub Pages(HTTPS)에 배포
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          NEXT_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      # _next 폴더가 Jekyll에 걸러지지 않도록
      - run: touch out/.nojekyll
      # 배포마다 서비스 워커 버전을 바꿔, 설치된 기기가 새 화면 파일을 오프라인용으로 다시 받게 한다
      - run: sed -i "s/^const VERSION = \".*\";/const VERSION = \"${GITHUB_SHA::7}\";/" out/sw.js && grep -m1 "^const VERSION" out/sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
